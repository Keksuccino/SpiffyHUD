
plugins {
    id 'java'
    id 'idea'
    id 'maven-publish'
    id "net.fabricmc.fabric-loom" version "$fabric_loom_version"
}

base {
    archivesName = "${mod_id}"
}

repositories {
    flatDir {
        dirs 'libs'
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    compileOnly "net.fabricmc:fabric-loader:${fabric_loader_version}"
    implementation "com.google.code.findbugs:jsr305:3.0.2"
    implementation "org.ow2.asm:asm-tree:9.7"
    annotationProcessor "org.ow2.asm:asm-util:9.7"
    compileOnly(annotationProcessor("io.github.llamalad7:mixinextras-common:${mixin_extras_version}"))
    compileOnly "org.spongepowered:mixin:0.8.5"
    compileOnly "maven.modrinth:melody:1.0.17-26.2-fabric"
    compileOnly "maven.modrinth:konkrete:1.11.1-26.2-fabric"
    compileOnly "maven.modrinth:fancymenu:3.9.5-26.2-fabric"
    compileOnly "net.objecthunter:exp4j:0.4.8"
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            artifactId = base.archivesName.get()
            from components.java
        }
    }
    repositories {
        maven {
            url = "file://" + System.getenv("local_maven")
        }
    }
}
